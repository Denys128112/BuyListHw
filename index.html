<!DOCTYPE html>
<html>
<head lang="uk">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Buylist">
    <title>Мій список покупок</title>
    <link rel="stylesheet" type="text/css" href="main.css" />
    <script src="script.js"></script>
</head>
<body>
    
    <div class="container">
        <form class="add-item-form" onsubmit="event.preventDefault(); addItem();">
            <input type="text" id="itemInput" placeholder="Назва товару"/>
            <button type="submit" class="submit-button" data-tooltip="Знайти і дoдати товар до списку">Дoдати</button>
        </form>

        <div class="list-container" id="itemList">
            
            <div class="ellement-section">
                <div class="item-name bought">Помідори</div>
                <div class="item-counter">
                 <input type="number" value="2" class="quantity-input">
                </div>
                <div class="item-actions">
                    <button type="button" class="status-button" onclick="toggleStatus(this.parentNode.parentNode)" data-tooltip="позначити як не куплено">Не куплено</button>
                </div>
            </div>

            <div class="ellement-section">
                <div class="item-name" onclick="renameItem(this)">Печиво</div>
                <div class="item-counter">
                    <button type="button" class="dec-button" data-tooltip="зменшити кількість" onclick="updateQuantity(this)">-</button>
                    <input type="number" value="2" class="quantity-input" readonly>
                    <button type="button" class="inc-button" data-tooltip="збільшити кількість" onclick="updateQuantity(this)">+</button>
                </div>
                <div class="item-actions">
                    <button type="button" class="status-button" onclick="toggleStatus(this.parentNode.parentNode)" data-tooltip="позначити як куплено">Куплено</button>
                    <button type="button" class="decline-button" onclick="deleteItem(this.parentNode.parentNode)" data-tooltip="видалити товар">x</button>
                </div>
            </div>

            <div class="ellement-section">
                <div class="item-name" onclick="renameItem(this)">Сир</div>
                <div class="item-counter">
                    <button type="button" class="dec-button disabled-btn" data-tooltip="зменшити кількість" onclick="updateQuantity(this)">-</button>
                    <input type="number" value="1" class="quantity-input">
                    <button type="button" class="inc-button" data-tooltip="збільшити кількість" onclick="updateQuantity(this)">+</button>
                </div>
                <div class="item-actions">
                    <button type="button" class="status-button" onclick="toggleStatus(this.parentNode.parentNode)" data-tooltip="позначити як куплено">Куплено</button>
                    <button type="button" class="decline-button" onclick="deleteItem(this.parentNode.parentNode)" data-tooltip="видалити товар">x</button>
                </div>
            </div>

        </div>
    </div>
	<div class="container results-container">
    
    <div class="summary-section">
        <h2 class="summary-title">Залишилося</h2>
        <div class="summary-tags">
            <div class="product-tag">
                <span class="tag-name">Печиво</span>
                <span class="tag-count">2</span>
            </div>
            <div class="product-tag">
                <span class="tag-name">Сир</span>
                <span class="tag-count">1</span>
            </div>
        </div>
    </div>

    <div class="summary-section">
        <h2 class="summary-title">Куплено</h2>
        <div class="summary-tags">
            <div class="product-tag">
                <span class="tag-name bought">Помідори</span>
                <span class="tag-count">2</span>
            </div>
        </div>
    </div>
</div>
<div class="badge">
	<div class="badge-content">Buy List</div>
	<div class="author"><span style="font-size: 14px;">Created by:</span><br>Kolisnyk Denys</div>
</div>

</body>
</html>
