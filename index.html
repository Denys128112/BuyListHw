<!DOCTYPE html>
<html>
<head lang="uk">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Buylist">
    <title>Мій список покупок</title>
    <link rel="stylesheet" type="text/css" href="main.css" />
</head>
<body>
    
    <div class="container">
        <form class="add-item-form">
            <input type="text" name="item" placeholder="Назва товару"/>
            <button type="submit" class="submit-button" data-tooltip="Знайти і додати товар до списку">Додати</button>
        </form>

        <div class="list-container">
            
            <div class="ellement-section">
                <div class="item-name tomato">Помідори</div>
                <div class="item-counter">
                 <input type="number" value="2" class="quantity-input">
                </div>
                <div class="item-actions">
                    <button type="button" class="status-button" data-tooltip="позначити як не куплено">Не куплено</button>
                </div>
            </div>

            <div class="ellement-section">
                <div class="item-name">Печиво</div>
                <div class="item-counter">
                    <button type="button" class="dec-button" data-tooltip="зменшити кількість">-</button>
                    <input type="number" value="2" class="quantity-input">
                    <button type="button" class="inc-button" data-tooltip="збільшити кількість">+</button>
                </div>
                <div class="item-actions">
                    <button type="button" class="status-button" data-tooltip="позначити як куплено">Куплено</button>
                    <button type="button" class="decline-button" data-tooltip="видалити товар">x</button>
                </div>
            </div>

            <div class="ellement-section">
                <div class="item-name">
                    <input type="text" class="edit-input" value="Сир">
                </div>
                <div class="item-counter">
                    <button type="button" class="dec-button disabled-btn" data-tooltip="зменшити кількість">-</button>
                    <input type="number" value="1" class="quantity-input">
                    <button type="button" class="inc-button" data-tooltip="збільшити кількість">+</button>
                </div>
                <div class="item-actions">
                    <button type="button" class="status-button" data-tooltip="позначити як куплено">Куплено</button>
                    <button type="button" class="decline-button" data-tooltip="видалити товар">x</button>
                </div>
            </div>

        </div>
    </div>
	<div class="container results-container">
    
    <div class="summary-section">
        <h2 class="summary-title">Залишилося</h2>
        <div class="summary-tags">
            <div class="product-tag">
                <span class="tag-name">Печиво</span>
                <span class="tag-count">2</span>
            </div>
            <div class="product-tag">
                <span class="tag-name">Сир</span>
                <span class="tag-count">1</span>
            </div>
        </div>
    </div>

    <div class="summary-section">
        <h2 class="summary-title">Куплено</h2>
        <div class="summary-tags">
            <div class="product-tag">
                <span class="tag-name tomato">Помідори</span>
                <span class="tag-count">2</span>
            </div>
        </div>
    </div>
</div>
<div class="badge">
	<div class="badge-content">Buy List</div>
	<div class="author"><span style="font-size: 14px;">Created by:</span><br>Kolisnyk Denys</div>
</div>

</body>
</html>
